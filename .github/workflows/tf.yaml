name: Terraform Infra Pipeline

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  id-token: write  # Required for Workload Identity Federation

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP using Workload Identity
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: "projects/516177572638/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "github-actions-sa@gcp-test-123-dev.iam.gserviceaccount.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Init
        run: |
            terraform -chdir=infra/env/${{ github.ref_name }} init \
                -backend-config="bucket=tf-gcp-test-123-${{ github.ref_name }}" \
                -backend-config="prefix=env/${{ github.ref_name }}"

      - name: Terraform Plan
        run: terraform -chdir=infra/env/${{ github.ref_name }} plan -out=tfplan

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/environments/${{ github.ref_name }}/tfplan

