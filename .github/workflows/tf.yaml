name: Terraform CI/CD

on:
  push:
    paths:
      - 'infra/**'  # Trigger only for changes in infra folder

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    env:
      ENV_NAME: ${{ github.ref_name }}       # Branch name as environment
      TF_BUCKET: tf-gcp-test-123-${{ github.ref_name }} # Bucket per environment

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Authenticate to GCP using Workload Identity
        uses: google-github-actions/auth@v1
        with:
            workload_identity_provider: "projects/PROJECT_ID/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
            service_account: "github-action-dev@gcp-test-123-dev.iam.gserviceaccount.com"


      - name: Terraform Init
        run: |
          terraform -chdir=infra/environments/${{ env.ENV_NAME }} init \
            -backend-config="bucket=${{ env.TF_BUCKET }}" \
            -backend-config="prefix=env/${{ env.ENV_NAME }}"

      - name: Terraform Plan
        run: terraform -chdir=infra/environments/${{ env.ENV_NAME }} plan -out=tfplan

      - name: Save Plan Artifact
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: infra/environments/${{ env.ENV_NAME }}/tfplan

