name: Build & Deploy to GKE

on:
  push:
    branches:
      - dev
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1          # Artifact Registry region
  REPO_NAME: python-app-dev
  IMAGE_NAME: flask-app
  CLUSTER_NAME: cluster
  CLUSTER_LOCATION: us-central1-c    # GKE cluster zone/region

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-env.outputs.image_tag }}
      environment: ${{ steps.set-env.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet


      - name: Set environment variables
        id: set-env
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "image_tag=1.0.0-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "image_tag=1.0.0-dev-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          docker build -t ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ steps.set-env.outputs.image_tag }} .

      - name: Push Docker image
        run: |
          docker push ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ steps.set-env.outputs.image_tag }}

  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.environment }}     
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true
          install_components: gke-gcloud-auth-plugin

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # - name: Install GKE Auth Plugin
      #   run: |
      #     gcloud components install gke-gcloud-auth-plugin -q

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.CLUSTER_NAME }}-${{ needs.build.outputs.environment }} \
            --region ${{ env.GAR_LOCATION }} \
            --project ${{ env.PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Deploy Helm Chart
        run: |
          helm upgrade --install ${{ env.IMAGE_NAME }}-${{ needs.build.outputs.environment }} ./charts/${{ env.IMAGE_NAME }} \
            -n ${{ needs.build.outputs.environment }} --create-namespace \
            -f ./charts/${{ env.IMAGE_NAME }}/values-${{ needs.build.outputs.environment }}.yaml \
            --set image.repository=${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}-${{ env.IMAGE_NAME }} \
            --set image.tag=${{ steps.set-env.outputs.image_tag }}



